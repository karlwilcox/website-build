  month: "Nov"
  prefix:
  title: "No-one Saw Us Leave"
  type: "tvshow"
  creator: "Netflix"
  review: >
    Spanish language production nicely dubbed into English. Story of two young
    children caught up with feuding Jewish/Mexican business families and
    abducted, somewhat reluctantly by their father and pursued on a global
    trotting trip by their mother. If it wasn't based on a true story you
    probably wouldn't believe it! But the clothes are lovely to look at.
- year: "2026"
  month: "Apr"
  prefix:
  title: "Outcome"
  type: "movie"
  creator: "Apple TV"
  review: >
    This seems to be a vehicle to let some big movie names practice their acting
    skills in roles outside their comfort zones. In some cases, like Keanu Reeves
    this is done really well but Jonah Hill plays a deeply irritating agent - it
    may well be a devastating take-down of the archetype but most of us don't deal
    with agents like that so it will largely pass us by and since Jonah was both
    producer and director there was no-one to tell him what an annoying screen
    presence his character was. Abandoned because of him!

