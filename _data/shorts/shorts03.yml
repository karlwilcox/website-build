- year: "2025"
  month: "Nov"
  prefix:
  title: "No-one Saw Us Leave"
  type: "tvshow"
  creator: "Netflix"
  review: >
    Spanish language production nicely dubbed into English. Story of two young
    children caught up with feuding Jewish/Mexican business families and
    abducted, somewhat reluctantly by their father and pursued on a global
    trotting trip by their mother. If it wasn't based on a true story you
    probably wouldn't believe it! But the clothes are lovely to look at.
- year: "2026"
  month: "Apr"
  prefix:
  title: "Outcome"
  type: "movie"
  creator: "Apple TV"
  review: >
    This seems to be a vehicle to let some big movie names practice their acting
    skills in roles outside their comfort zones. In some cases, like Keanu Reeves
    this is done really well but Jonah Hill plays a deeply irritating agent - it
    may well be a devastating take-down of the archetype but most of us don't deal
    with agents like that so it will largely pass us by and since Jonah was both
    producer and director there was no-one to tell him what an annoying screen
    presence his character was. Abandoned because of him!
- year: "2026"
  month: "Jun"
  prefix: "The"
  title: "Choral"
  type: "movie"
  creator: "Sky Cinema"
  review: >
    A clever, Dennis Potter written film that managed to pack in a great number of
    World War One themes without once leaving the confines of a small Yorkshire
    mill town. A good ensemble cast helped this along and you almost wanted this to
    be a true story as it really involved you and interested you in the characters
    and their lives.
- year: "2026"
  month: "Jun"
  prefix:
  title: "Elle"
  type: "tvshow"
  creator: "Amazon Prime"
  review: >
    A nicely done fish-out-of-water take on a prequel to Legally Blonde sees the
    family temporarily relocated to Seattle to avoid a cosmetic incident scandal.
    There's no sign of Edward Cullen but it could be the same high school. Light,
    fluffy, well written and acted but just too light and fluffy to sustain long
    term interest for me, but you have fun with it though!
- year: "2026"
  month: "Jul"
  title: "Ann Droid"
  type: "tvshow"
  creator: "BBC iPlayer"
  review: >
    A delighful comedy, really held together by Sue Johnston. I suspect it will 
    date quite badly as it revolves around the social misunderstands of a Android
    helper, something that AIs are already getting better at. The character of
    Michael is exactly the same as that he played in "Motherland" so not exactly
    a stretch and other characters lack depth but are none-the-less funny because
    we all know people like that!
- year: "2026"
  month: "Jul"
  title: "Slow Horses Season 5"
  type: "tvshow"
  creator: "Apple TV+"
  review: >
    I don't have a lot to say about this season but then this season doesn't have
    a lot to say to me. We have all the things we know and love, the banter,
    bickering and dysfunction and a "villain of the week" style adversary but
    there's nothing that we haven't seen before and everyone (including the
    viewer) is back where they started at the opening episode. That's not to 
    say it isn't entertaining, it just doesn't seem to go anywhere. Competent,
    exciting in places but just fairly forgettable time filler television.
- year: "2026"
  month: "Aug"
  title: "The Dink"
  type: "movie"
  creator: "Apple TV"
  review: >
    A harmless, pleasant way to spend a couple of hours, with everyone involved clearly
    having a lot of fun in this story of the upcoming pickle-baller's battles
    with the old guard at a tennis club. No peril, several real laughs and some
    great cameos by Andy Roddick and John McEnroe.
