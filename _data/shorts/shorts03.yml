- year: "2025"
  month: "Nov"
  prefix:
  title: "No-one Saw Us Leave"
  type: "tvshow"
  creator: "Netflix"
  review: >
    Spanish language production nicely dubbed into English. Story of two young
    children caught up with feuding Jewish/Mexican business families and
    abducted, somewhat reluctantly by their father and pursued on a global
    trotting trip by their mother. If it wasn't based on a true story you
    probably wouldn't believe it! But the clothes are lovely to look at.
- year: "2026"
  month: "Apr"
  prefix:
  title: "Outcome"
  type: "movie"
  creator: "Apple TV"
  review: >
    This seems to be a vehicle to let some big movie names practice their acting
    skills in roles outside their comfort zones. In some cases, like Keanu Reeves
    this is done really well but Jonah Hill plays a deeply irritating agent - it
    may well be a devastating take-down of the archetype but most of us don't deal
    with agents like that so it will largely pass us by and since Jonah was both
    producer and director there was no-one to tell him what an annoying screen
    presence his character was. Abandoned because of him!
- year: "2026"
  month: "Jun"
  prefix: "The"
  title: "Choral"
  type: "movie"
  creator: "Sky Cinema"
  review: >
    A clever, Dennis Potter written film that managed to pack in a great number of
    World War One themes without once leaving the confines of a small Yorkshire
    mill town. A good ensemble cast helped this along and you almost wanted this to
    be a true story as it really involved you and interested you in the characters
    and their lives.
- year: "2026"
  month: "Jun"
  prefix:
  title: "Elle"
  type: "tvshow"
  creator: "Amazon Prime"
  review: >
    A nicely done fish-out-of-water take on a prequel to Legally Blonde sees the
    family temporarily relocated to Seattle to avoid a cosmetic incident scandal.
    There's no sign of Edward Cullen but it could be the same high school. Light,
    fluffy, well written and acted but just too light and fluffy to sustain long
    term interest for me, but you have fun with it though!